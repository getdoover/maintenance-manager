name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
    paths:
      - 'dashboard-widget/**'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: dashboard-widget/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: dashboard-widget
      - name: Build
        run: npm run build
        working-directory: dashboard-widget
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dashboard-widget/assets'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
